services:
  - type: web
    name: white-queen-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: white_queen_db
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
